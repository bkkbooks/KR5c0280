front:
  text: 太清金液神氣經卷下興九衆真授許先生經杜從事處具有十卷今抄取其要此人有郭子華張季連趙叔達晚又有山世逺者此諸人往來與之遊焉在武當山今在大霍山欲從司命君授書未許焉戴公拍腹有許卷書耳此人即謝允之師也黃衣童者即玉珮金璫之官耳云座上常有一人共坐胇胇者即太極真人時往來也受行玉珮金璫經自然致太極真人諺云服九靈日精月華得降我太極之家此之謂也玄真之法亦其鈔要也行之者神仙不死良常山有螢火芝此物在地如螢火狀其實似草而非也大如豆紫華夜視有光食一枚心中一孔明食至七枚七孔明可夜書計得四十七枚壽萬年也山中有白芝又有隱泉之水正紫色華陽雷平山有田公泉水飲食之除腹中三蟲與隱泉水同味云是玉沙之流津也用以浣衣不用灰以此為異也昔髙辛時有仙人展上公者於伏龍地植李彌滿其地展先生今為九宫右保司其常説向人云昔在華陽下食白李異美憶之未久而忽巳三千年矣其處種五果此地善可種李所謂福鄉之李以除災癘今舍前有塘乃郭四朝所造也髙其墉岸益水得深但歷代久逺塘牆頽下耳四朝常乘小船遊戲其中叩船而歌曰清池帶靈岫長林鬱青蔥玄鳥翔幽野悟言出從容鼓楫乘神舟稽首希晨風未獲解脫期逍遙丘林中浪神九陔外研道遂全真戢此靈鳯羽藏我華龍鱗髙舉方寸物萬吹皆垢塵顧哀朝生慧孰盡汝車輪遊空落飛飈虛步無形方圖景煥明霞九鳯唱朝陽揮翮扇天津暗靄慶雲翔遂造太微宇挹此金梨漿逍遙玄陔表不存亦不亡駕歘儛神霄披霞帶九日髙皇齊龍輪遂回北華室神虎洞瓊林風雲合成一開闔幽冥户靈變玄迹滅趙威伯者東郡人也少學邯鄲張先生得道之人耳晚在中嶽受玉珮金璫經河圖云吳楚多有得見太平者其常語人云此語不虛此驗甚久樂長治主災害鄭稚政主考注唐公房主生死趙威伯主仙籍并記學道者并暴雨水靈芝草七月二十七日禺中訖主簿華侯當入靖中爾時無復所有為防未然耳八月六日父母將赤子入靖燒香北向陳乞於三君爾時自當有前日碧衣介革袴人來在靖前立徘徊者小君也可就乞請也八月六日中當有一人著平上幘鬚髭長長爾著紫皮袴褶將黃娥來此人是鬼帥王延也延自為人作益為將娥見人耳娥其日或當被縛華書吏其日當內井上助主人耳日中當來須臾去也玄感妙象外和聲自相招靈雲鬱紫晨蘭風扇緑軺上真宴瓊臺邈為地仙標所期貴逺邁故能秀頴翹玩彼八素翰道成初不遼人事胡可預使爾形氣消
