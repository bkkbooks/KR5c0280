body:
  text: 右四月二十七日夜南嶽夫人作太上宫中歌曰手把八雲氣英明守二瞳太真握明鏡鑒照日月鋒雲儀拂髙闕開括泥丸宮萬響入百關嬌女坐玄房愈行愈鮮盛英靈自爾通此歌正言耳目之經也我滄浪方丈仙人常寶而為道也出太上四明玉經中傳行以青金為誓然後乃施行耳轡景落滄浪騰躍清海津絳煙亂太陽羽蓋傾九天雲輿浮空洞倐忽風波間來尋冥中友相携侍帝晨王子協明德齊首招玉賢下眄八阿宮上寢希林巔漱此紫瓊腴方知除穢辛佳人將安在勤之乃得親右七月二十六日夜雲林右英王夫人諭書見與勿答擬駕東岑人停景招隱靜仁德乘波來但會三秀嶺靈芝信可食使爾無終永吸真獻金漿不待百丈井右八月十六日夕清靈真人授此年六月憂長史不佳非重疾也今年許家鬼注小起雖爾無可若保命及范中候已為申陳之右師辰許肇亦深以為意無憂也可迎黃民來出民奴既欲來又云其月末左右當小小疾患迎來在此則疾患除也當部分護靜屋以為急并欲得一室可棲息處今年欲取草當為民奴留之草今年自有本命厄非欲取也令其乞符自保而帶之卧牀後孤有懸風可安北面下一障亦可以牀著近北壁下勿使虛懸晨夕當心存拜靜心存行道也民有霍亂疾勿使冷食此鬼常不大冝住彼今自無他耳右易遷一夕再來道此先初來之又與保命俱夜卧覺存日象在疾手中握之使日光赤芒從臂中逆至肘腋間良久日芒忽變成火以燒臂使內外通匝洞徹良久乃隂祝曰四明初上日月氣分流光煥曜灌液凝神大火散景蕩穢鍊煙洞徹風氣百邪燔然使得長生四支完全注害拷鬼收付北辰畢存思良久放身自忘右保命説此云按消魔上祕祝法岡山東北有穴通大句曲南方山之南穴薑伯真數在此山上取石腦石腦在方山北穴下繁陽子昔亦取服此北佇山中亦有此物石腦故如石但小班色而軟耳所在有之服此時時使人發熱又使人不渴人死必視其形如生人皆尸解也視足不青皮不聚者亦尸解也要目光不毀無異生人亦尸解也白日尸解自是仙非尸解之例也許長史今所營屋宅東面有小山名雷平山周時有雷氏養龍來在此山後有薑叔荗田公亦居焉其山北有栁汧水或名曰田公泉以其人曽居此山取此水故也彭文閻慶等自與先生别後各溺於世事不能卒其學戒曰學道如穿井形愈深而去土愈難運出自當披其心正其行乃得見泉源耳有人説季中候言如此可令知之人學道譬如萬里行比造所在寒暑善惡草木水土無不經見也亦試在其中也頃數聞人道此始乃悟之耳彼君念想殊多渠能成逺志平昔時常多所恨始人難作而善不可失云學道者除禍責此審爾當勤右易遷夫人所道夫學道者當得專道注真情無散念輟奢侈保沖泊寂焉如密有所覩熙然如潛有所得專專如造於深谷戰戰如履於薄氷始得道之門耳猶未得道室也所謂為難者學道也所謂為易者學道也寂玄沈味保和天真注神棲靈耽研六府惜精下氣無視無聽此道之易也即是不能行此者所以為難也許侯研之哉斧子瑩之哉右右英所道令疏彼君勤其事者有獲福者多也墮之者禍敗積矣范師所言不知道誰昔有一人好道而不知求道之方唯朝夕拜跪向一枯樹輒云乞長生如此二十八年不倦枯木一旦忽然生華又有汁甜如蜜有人教食之遂取此華及汁並食食訖即仙矣如是用心精誠之至也枯木尚能生紫華濯甘津況三秀之靈柯五芝所播種而不能數恭山岫洗拔滓穢者良可悲也世人所以每不得如意者亦如子所不得如意耳豈異也昔有劉少翁曽數入太華山中拜禮向山如是二十年遂忽一旦得見西嶽丈人授其仙道昔有一人旦旦詣河邊拜河水如此十年河伯遂與相見與其白璧十雙教授水行不溺法此人見在中嶽得道左慈初來亦勤心數拜禮靈山五年許乃得深進內外東西宮耳學道當如山世逺去人事當如清靈真人步深幽當如周紫陽何有不得道邪建志當令勤研神當令虛所作當令密右定録君所道使疏紙二百酬鬼帥王延執録書以捍災會有功油三斗酬鬼帥傳晃近與功曹使者合勢威敗火鬼形使不得為暴青繒三十匹酬鬼帥范強近執截百惡滅訟散禍有功銀叉三枚酬鬼帥徐衛近防護疾者招魂安神使塜訟不行有殊功右四條𧵥以六月十三日小茅君假作玉斧之形以夢告於虎牙使令夫婦明輸此四種𧵥以酬四帥之禽鬼者何不復憶此可餘問此四鬼帥本亦是道家之靈官也得下解法受書為鬼帥耳既有酬𧵥後長為己用心也所以夢假於玉斧之形者虎牙魂魄永得通接仙真故也玉斧清了澡潔久齋濯魄心近於仙故假象以通夢也通夢而猶不悟可謂信之不篤或悟而忘其𧵥可謂篤而不思夫𧵥可謂篤而思夫𧵥誓者皆命密文愼不可令人知外書云我聞有命不可以示人乎六月三十日夜小君授書密密示之真司科云有用力於百鬼騁帥御於天威者冝須此𧵥子喬兄弟七人得道五男二女扶晨始暉生紫雲映玄阿煥洞圓光蔚晃朗濯耀羅眇眇虛景元森灑空清華九天館王賔金房唱霄歌右大洞真經中篇今鈔數行外國呼日為濯耀羅方諸真人呼日為圓羅曜夢此濯羅者日之應也紫雲中人者胎宫神也玄真之道矣日德蔭澤長生之象紫雲網晨魂魄安之也身康神寧從此始矣辭四通巳呈意氣和安右右英疏大洞真經言以釋濯耀羅之義也凡夜行常當叩齒不止無限數也殺鬼邪鬼常畏琢齒聲故不得犯人也若兼之以漱咽祝説益善今六天之橫縱而太平微薄靈不足以助順適足以招群姦所以神光披越而邪乘正任矣髙齡之無德久矣鬼訟之紛錯積矣許椽將欲理之邪若翻然奉張諱道者我當與其符使服之如此必愈而即豁矣不然往詣水官所謂嗚呼哀哉衰年體瘦多為風寒所乘當深頥養宴此無事上味玄元棲守絳津體寂至逺心研內觀屏彼萬纍蕩除他念乃始近其門户耳若憂纍多端人事未省雖復憩靈空洞存淡纏綿亦弗能逮也漁陽田豫曰人以老馳車輪者譬猶鍾鳴漏盡而夜行不休是罪人也以此論老者嗜好行來屑屑與年少為黨耳若今能誓不能行者則立愈矣如其不爾則疾與年偕可與心共議邪藥四丸日服一行來冝詳前後巳纍言停駕望舒移回輪反滄浪未覩若人遊偶想安得康良因俟清春以敘中懷忘右右英夫人吟此再三受書則師乃恥之邪真心既有不盡獲考者非一人子經師蘇林守一虎牙當先齋受其或能得此度世幾未可量也暮卧存星之時皆先隂祝星名然後存耳呪畢乃存星安卧其中也然後容叩齒祝九星太精微誠因理感積精洞幽真排徊乘雲綵靈像憑紫煙眇眇濯圓羅斐斐駕飛輪玄翰啓朦昧顧景思自新道家有二百一法謂有二百一條方術之事雖修方術能形變神化坐在立亡飛行空虛出入無間役使鬼神隱海藏山分形别體束縛萬軍而皆不能長生度世與道無窮無窮之道在乎功德於人物而無以點身不誠不虔於師匠章奏祈無益也凡師皆冝盡節邪朝半時節皆冝先朝禮經師然後行道右一條許先生言雷平山之東北有山俗人呼為大潢山其實名鬱岡山也名山記所謂岡山者也下有泉水昔李明於此下合神丹而升玄洲水邊今猶有處所此山正東面有古時越翳王塜右定録言若弟子有心者按摩疾處皆用此法但不復令臨目內視咽液叩齒耳昔唐覽者居林慮山中為鬼所擊舉身不收巳如綿囊有道人教按此法皆即除也北帝曲折之法諸疾有曲折者用此法皆佳不但風痺不收而巳也酆都北帝有此數法亦參於髙仙家用也又有曲折經藏著西明公處右説北帝曲折諸祝法夫風考之行也皆因衰氣之間隙耳體有虧縮故病來侵之也若令差愈誠能省周旋之役者必風痾除之也今當為攝制冢注之氣爾既小佳亦可上塜訟章我當為關奏之也於是注氣絶矣昔鄧雲山亭當得道頓兩手不收吾使人語之令灸風徊曲津兩處耳六七日間便得作五禽按摩也若針力訖當語所灸處又存心行道亦與身行之無異也昔趙公成兩腳曳不得起旦夕存拜太上如此三十年太上遣真人賜公成流明檀桓散一劑即能起行後遂得道今在鶴鳴山下夫心存拜及心行道之時皆燒香左右如欲行事之狀也此謂納研太玄心行靈業棲息三宫宴神六府者矣右保命言太清金液神氣經卷下
