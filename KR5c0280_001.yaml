body:
  text: 右太皇靈䇿一百一十九言封之玉篋不傳於世得聞之者皆有神童玉女侍之祕藏清室勿輕侮也三光伐人清虚眞人曰玉章神丹至道之大蓋太元混化五色流精結耀星辰日月之明合符天圖混氣五靈太陽通氣五石發精朱紫翠緑極耀光明能得其要上昇泰清三都六虚肆心所經得一足矣勿用多營此其要道見者長生清虚眞人曰三丹要道太皇所紀祕之玉堂不示凡子絳晨神丹上眞所始瓊蘂入口氣絶復起地品隂丹長生不死无常圓化分形翳已招召行𢊍神靈爲使一品萬金壽至无已祕之祕之勿傳其旨太玄清虚上皇太眞玄丹經一名三光神符一名絳晨朱霞一名剛華上丹一名八瓊飛華一名太微紫蘂明珠第一八靈神童八斤第二玄陽流精五斤第三沈華神女四斤第四玄英玉華八斤第五素靈雲石九斤第六五英沈精二斤第七八瓊流膏十二兩第八素靈明景八兩第九日耀沈精七兩第十月精剛華十兩第十一玄景珠琳八兩第十二日精合耀十兩第十三素景飛剛十二兩第十四東華清景七兩第十五素符龍剛八兩第十六九陽明光六兩第十七北剛玄華十三兩第十八飛剛金兵八兩第十九五雲明英六兩第二十日景七華七兩第二十一北極丈人九兩第二十二金虎餘骨六兩第二十三玄剛子明八兩第二十四九靈沈石九兩第二十五威七明七兩第二十六兩華沈精十兩第二十七玄符石母七兩第二十八太靈甘華八兩凡二十八物象二十八宿星之靈符也刻於清虚之堂太皇君之寳章也見古文者有九人命曰紫蘂明珠之丹太皇君合神丹之要先作太一土釜二令受一斛二斗使内外令厚内二寸極使精宻畢乃擣二十八石各四千杵皆以絹素篩之凡二十八物合擣十一萬二千杵也如是治藥畢又用天玄地黃以薦覆之當以礬石水和地黄六斤令如封泥泥下釜爲薦也使厚一寸五分置日中乾之使精燥乃納諸石物次納神童次納流精次納神女次納玉華後納二十八石又覆以天玄五斤於是安藥都畢可以一釜上合之又以太一泥封其㑹際復隂乾十五日使内外堅宻无令有坼畢乃安釜於鐵𨭊之上令𨭊脚髙二尺五寸以糠火燒之初起火之日可半𨭊脚至一十二日日足令火去下釜七寸又至二十四日日足令火去下釜五寸復足十二日令火去下釜三寸又十三日火去下釜一寸復八日可引火平釜下復至二十四日可進火令平下釜腹也從九十二日後可小進火令未及下釜之上一寸復二十八日止凡一百二十日也又清之五日可以開之藥當丹紫寳耀華光丈蔚不可名字或化爲五雲之精或結成日月之明乃以三歳雄鷄左羽掃取之藏金器銀器夜則降覆焉以五月五日及夏至日二月八月朔日清朝以寒水服一丸則白日昇晨矣若不樂昇者可服半劑則使鬼神眞人來降運上清之𢊍乗龍上昇所須隨意命曰无極眞人服如大豆者以清水三合和丹若死者未至三年以漱其白骨皆愈氣還同生又以丹水一合投口中至口則語矣當隂地爲之勿見三光也右太皇絳晨第一篇服之白日昇晨出入虚无萬化隨心若火日足而光華未發五色不具者此日未服於火故也當更泥如先可重火之初火之日使以火釜下至二十八日可引火至下釜之上復三十二日止凡六十日萬无不成也又清之五日開之如初太玄新都无常品剛七化上經髙章第二清虚眞人曰開元迴化混爾而分隂陽屢變其道自然玄圖七轉至九而還太皇命䇿書曰靈篇无常无品法象九晨陽光潜啓明景流烟三迴五變和以七津隨色鬰曜各歸其神得此之道位爲上眞祕之祕之愼无爾傳清虚眞人曰迴元七化至道之靈霞耀日月蓊然九明歘爾而化翳景藏形嘘吸靈和貫盈八冥神竒萬化隨意所營乗虚駕空上遊天庭迴元之始知者光明大黄首篇是曰玉英上眞寳之命曰第一元經太玄无常品第九剛七化丹經一名隂陽神符一名日月玄剛一名素華明景一名九晨朱房一名歘化靈童一名无極沈暉一名八明神丹第一八靈朱童四斤第二玄陽沈精二斤第三沈華神女十八斤第四玄隂玉華一斤第五六液沈華十兩第六日暉沈精五兩第七八靈雲光八兩第八素景飛剛七兩第九太虚素女十二兩第十靈華沈液十兩第十一華泉水母十兩第十二月景沈剛六兩第十三七曜靈童五兩第十四玄剛子明八兩第十五靈符石母九兩第十六黃元甘石一斤凡十六種以象九晨七元之靈符結五行之精微氣法玄宿之元圖也以次擣之各三千杵以絹篩之畢納於九晨土釜之中上下二釜令各受七升太陽玄精七斤薦覆之於是安藥都畢又以一釜合之更以九晨土塗其㑹際又乾之十日使極堅燥安釜於三台之上皆髙三尺以糠火燒其下初火之日令火去釜下一寸又至十五日令火平之下又至二十二日可引火進下釜之半復至九日可齊下釜之上又九日止清之五日徐徐開之藥當光華符耀流霞洞明有八十一種之色以白鷄左羽掃藏之金銅之器勿令潜泄也以孟月上旬本命之日再拜以清水和丹服一兩即頭生九晨之光面有玉童眞人之色降靈童玉女皆奉侍其側騰虚駕空役使神靈上造紫晨矣即以太陽玄精一斤日盛中時合丹於漆器向日以長匕攪之使和明日又納一斤凡三日三斤可藏之宻器之中復三日丹當更生五色之光命曰九晨三化之丹以七靈之道也取三化之丹和以白英水內於九晨釜中以白礬石之精各二兩上下薦覆之封如初以微火伏養之初火之日令去釜下三尺至九日日足令火平釜下十八日止清之三日開發如初丹當光明而白命曰一化白輝之丹以一化白輝之丹更以磁石水和之以黒磁石之精薦覆各二兩火如初命曰二化黒輝丹以曽青水沈飛門上膽和二化黒輝之丹以曽青之精薦覆火之如初命曰三化青輝之丹以朱砂水和三化青輝之丹以赤朱砂之精薦覆火之如初法命曰四化赤輝之丹以雌黃水和四化赤輝之丹以雌黃之精薦覆火之如初法命曰五化黃輝之丹三迴五化七靈之道成矣以三迴五化白輝之丹納於竹杖之中以行主殺萬魅鬼神之精虎兕蛇蝮指之立死以三迴五化黒輝之丹玄冥君逆占天蓋和塗右手閉氣而招四方立致行𢊍隨言而來以三迴五化青輝之丹服一丸九晨之上則白日昇晨爲上帝清虚眞人服半丸則長生无極役使鬼神以三迴五化赤輝之丹服一丸九晨之上則玉女侍之服一丸三晨之上則役使神靈以三迴五化黃輝之丹服一丸五晨之上則白日昇晨上敬太皇以上清水和之與百歳翁服之則面生玉光身體飛輕通靈无極矣清虚眞人曰五輝之丹道之靈七符要妙和元精洞達九晨飛神明迴而化之華光生能知其要遊上清清虚玉堂太皇經靈書深微妙无程太玄新都地品九隂靈華丹上經髙章第三清虚眞人曰隂丹大道結靈文玉䇿表圖列五晨二七應偶隂陽陳明珠極輝發華煙幽光潜液爲朱津玄泉結氣通九晨三七足矣清且醇流霞五色鬱蕃婉能知其要昇太玄文寳誠祕在吾篇藏之玉堂授大賢清虚眞人曰靈䇿玉文是玄書上皇寳之爲天符隂丹之道同六虚日月之精文光流靈蘂潜化成紫腴得而飲之與明珠知此之道仙之夫莫令愚人見吾書太皇所戒愼之哉太玄九隂靈華丹一名九晨隂剛丹一名素靈明珠一名月影玉華一名紫瓊靈腴一名丹蘂九符液第一玄陽流精六斤第二沈英神女四斤第三玄隂玉華二斤第四青影飛剛十四兩第五日輝沈精十二兩第六八靈雲光八兩第七素景飛剛七兩第八靈華隱曜十兩第九華泉石母二十兩第十六液沈精八兩第十一中黃童子二十四兩第十二太靈甘華二十兩凡十二石以合十二神之氣和五行之靈符結日月之輝影也可使童子二人沐浴清靜以次擣諸藥各四千杵皆以絹素篩之竟納於六一釜中令釜上下二枚各受六斗先以太陽玄精三斤納薦釜中次納流精次納神女次納玉華次納飛龍次納甘石十二石都畢好安穩抑按之於是他藥竟又以一土釜合之更以六一泥封其㑹際乾十日令釜精宻乃可納之於四𨭊髙二尺以馬通若糠火於下燒之初火之日令火半四𨭊之脚至十二日可又進之令去土釜五寸又至十二日令火去釜下二寸復至二十四日可進火齊釜下又至二十四日復引火下釜之半腹二十四日以火平下釜之上又至二十八日止可又清之三日徐徐開之藥當精華仰著文光寳輝慶雲之色即以鷄羽掃之藏於金銀之器懸之暗室則朱光見焉以本命之日清水服一匕上則壽同晨極役使鬼神眞人來降玉女奉侍致天上之𢊍役使華晨之龍於是騰空躍虚上造紫房位至眞極命曰无上仙王又以此丹九兩納於青竹筒薄削其表以白蠟宻固其口藏之於北極之下令深三尺畢又平至三十二日當化成水命曰紫蘂之腴又以瓊腴和上清九靈之玄水三斗則以新器藏之以白蠟封其口至二十一日成丹蘂九符之玄水玄水成開之上生靈華五色之煙又以九符玄水一合隂丹一匕向太陽再拜服之立登仙矣又亦可隂丹三兩分爲十二分清水服之十二日亦白日昇晨上士服丹可不須此玄水又但單服九符玄水一合百日則神仙无極慶雲見而眞人至若人有病者但以口嘘之立愈若欲呼召鬼神致天𢊍者可閉氣而存之則所命立至又死已三日者以隂丹如黍米者合水灌其口立生矣十三日比語并一丸塗其心即活矣若藥精未發者可更封其際復十五日更火之日使平釜下至十五日可引火至下釜上至二十一日止凡五十日也復清之三日開之如初萬无不成清虚眞人曰至道要妙在其中吾神列輝還四宫隂丹十二亦爲雄太陽通霞伏朱光清靈上士造玉堂中士服之昇玄房愚人下士半天翔須得九符之華剛妙哉妙哉爲仙王故設此語昇天倉太清金液神氣經卷上
