front:
  text: 太清金液神氣經卷上興七夫清虚太皇者蓋太初之混化邃古之元靈也以幽廓玄化遂遊乎上清莅四司於无極肈圖變於八𡨋登紫空以迴晏隱九晨以化靈渺渺躍天九空麗神微於虚清登五神於七元妙六氣於混成非夫玉章之髙文孰能致妙眞於靈津矣然後致三素於九霄御龍剛於太微宴紫房之微邈妙虚運於扶羲登七剛於圓化歘空洞以散儀神符玉篆九變結於玉章靈䇿表玄玉精緘於千金於是幽門旣啓皇經以陳金光之章見而明明之道臻然靈霞潜耀幽曖傍申周流獨化惚恍靈混抃手則大明分耀擊石則五嶽迴遷微詠則絳晨結耀騰躍則奔景虚玄四眞翼其左右五帝輔其威神七政守乎玉衡三光紛乎散影萬化流遷闢无常之户啓七變之津大哉清虚之靈章混洞之赤文三竒之神符登太初之靈門服盡一劑則上遊九天可不崇歟寳於明玉之堂戒以太皇之妙哉爾愼无傳妄人玄元太皇靈䇿曰玉章神符見吾堂五靈結情還其方七神正氣伏朱光隱耀玄圖合五行三竒九轉成琅玕清虚上眞絳晨丹長生不死在金根圓化萬變法九晨一轉而成九化眞太陽通氣伏靈盤能得其要爲天仙十世流德結大恩玄門已闢見吾言得吾道者命長存失吾道者墜黄泉野俗愚瞽勿令聞戒愼丁寧莫妄傳
