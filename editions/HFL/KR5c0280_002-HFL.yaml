seq: 2
front:
  text: 太清金液神氣經卷中興八黃帝曰人皇者皆知死生之録識百鬼之名記萬神姓字求延年益壽法當䟽人皇一通書已姓名年月日歳州郡縣郷里亭社因祖𦵏之時便内此䟽塜中祝曰生則有死命録所當某甲不録大幽藏今已安蒿里冥冥逰長悲哭之訖乃還更當易姓字不得與前也於是千秋萬歳不復死矣録籍已定死名長滅不能作此法者但可䟽著塜中終身不病冝子孫縣官盗賊謀議已者還彼身中說巳者斷舌口噤追已者足折視已者目盲此法書著繒上依法修之也
  hash: sha256:efcd1f3234981f113a8e55d664f6ced1c766e857a1448598c69da143edbd52b2
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0280_HFL_002-001a, image: hfl/0583/0583-060.png}
body:
  text: 天神姓名字祕文天者太一所生太一名務猶収字歸㑹昌知之者長生不死夕夕存之也天公一號天父姓皇字湯君日姓張名表字長史月姓文名甲字子光七星姓張名列字世容雷公姓果字君吾東王公姓无爲字君解西王母姓自然字君思一字文殊右八神男知之者不兵傷女能憶識不乳死東方句芒君南方祝融君西方蓐収君北方玄𡨋君中央軒轅君右五神常呼之令不病病者呼之保不死死而呼之必復生東方青帝姓産名並字愼遷南方赤帝姓温名業字使卿西方白帝姓趙名鐘字元照北方黒帝姓葛名賢字秋都中央黄帝姓陽名次字元都右五帝姓名字知之百鬼爲却在家者持名置堂中央亦可書素符之禁前大吉上件出天皇文第一卷地神姓名字祕文后土姓冥名薰大山姓馮天名𦣟嵩字舍眞小山姓崇名𡹦字𦣟𡼉東嶽姓歳名𣞏君南嶽姓榮名𣋎君西嶽姓華名𣦣君北嶽姓𡒑名𠨤君中嶽姓惲名𡾗君右土地山嶽姓名字知之行來入山風雨不迷所向通利禍散災消善願成遂東海姓何名歸居君南海姓劉名嚻君西海姓裏名漱君北海姓呉名禺强君河伯姓馮夷字君平右五水神知者長生乆視周旋八極往還十方不畏風波不憂飢渇過度三災九戹常保元亨利貞教化廣被一切歡樂无極一豫州社姓范名施二雍州社姓修名理三梁州社姓黃名宗四荆州社姓張名豫五揚州社姓鄒名昆六徐州社姓韓名季七青州社姓殷名育八兖州社姓費名明九冀州社姓馮名遷稷姓載名髙右九州上應九天九皇之根九宫所在堯時大水分爲十二夏禹復爲九州漢武帝分豫立司十有三州多歴年所後漢以來分立稍多神明所領九州爲常能憶九州之社一天之稷呼其姓名問其是非皆白兆吉凶可役而使之賞善罰惡救濟蒼生也凡欲致萬神求昇仙皆先潔齋清已香水灌頭沐浴五香蓋淨身體也百日之後乃可致神明欲求仙者當從北嶽西嶽中嶽眞人求靈飛散得而服之必得神仙矣眞人曰凡欲學仙不老長生久視白髮更黒齒落更生面目悅懌肌肉有光從表覩裏者當服靈飛散老子曰此方術之要神仙之道必化之本道士服之神仙不難術士服之飛遊華山凡災服之年去復還老公服之反生童顔老子曰服此藥者可以不老十日服之三年不食服之三年可壽二千六百二十四歳我非一人皆得眞道保成神仙靈飛散方雲母一斤成錬者茯苓半斤亦可一斤栢子仁七兩續斷草七兩石鐘乳七兩菊花五兩亦可十五兩术四兩乾地黃十三兩桂七兩凡九物治下篩訖以天門冬一十斤㕮咀絞取汁以丸此藥汁多和之汁少者溲之著銅器中懸著甑下蒸黍米一斛二斗下熟出藥曝乾更治令細篩服一方寸𠤎旦服無毒可多服耳當食十日身輕二十日耳目聦明七十日頭髮白返黒故齒皆去若落去者取藥二十七𠤎以白蜜和之擣二百下止丸如梧子可得八十一丸曝令燥訖視凡表裏相見如明月珠或似螢火精珠或赤或白此仙人隨身常所服藥也欲令頭髮時生者日服七丸至髮生不白不落若入深山不食亦可作此丸日服七丸不飢也若頭髮不落未白但可服散壽六百年不白耳白者如前法巳白服藥可至一百一十七年乃落耳求道必仙要至神仙髮齒更生如三十時求道服藥髮不白齒不落老而服之得仙之要齒骨尸解道之下者凡作此靈飛散服之三日力倍五日血脉盛七日身輕十日面目恱澤智慧聦明十五日力作不知極徐行及馬二十日不可復當三十五日夜視有光治雲母粉法白鹽一斤和合雲母一斤并擣之雲母糜勿篩納重布囊中挼梴之水汰鹽味盡納絹囊中懸令乾即成粉一法以鹽湯煮之盡解如泥狀挻之爲粉又法雲母一斤大鹽一斤漬之銅器中三四蒸之一日於臼中擣之爲粉又法用朴硝水三斗水煮法雲母一斤取盛粉燥舒之向日光㸔无芒便好有芒勿服服之乆後病殺人冝精治之也漆丹法漆三斗亦可二升淳不澆者丹砂一斤色如雄雞冠无黶雜者二物下細篩淳大醋三斗和合相得著銅器中火上微煮之三日三夜向欲成時當如水克欲熟如油澤以銅器著地須㬰凝可丸服如小豆二丸清玄水進之不堪玄水者亦可咽液吞之勿雜食三十日病愈三尸去百日肌堅骨强千日司命削死籍與天地相保日月相望攺形易體日中无影天地運攺唯我常在遊宴三清爲種姓之宗未央丸方雲母二斤松脂四斤水銀三兩天門冬一斤亦可二兩凡四物㕮咀納著大竹筒中復以大竹筒例沓之令得强下下訖復以麻約其筒三上塞其口勿令泄蒸之十斛米下若不能一頓炊之耳訖出筒不須出藥筒著户上裏面二十一日内氣出爲隂外氣入爲陽二氣足藥乃成更出治之五百下若藥燥者可以蜜和之常以成日西北向服之如大豆二丸却五十日復服二丸復五十日復服二丸自此之後二百歳復服二丸却千九百歳復服二丸若鬢髮變白者服四丸即不白矣自此之後可不服也若力氣弱者爲五六千歳後可復服一丸當絶房室斷隂陽若欲昇天見玉女者服七丸訖以申日加申時西南向日閉氣六十息訖急瞑目向日復二十息目中當見青紫色者從額上摩來入口中四摩之訖乃閉口空咽滿百七十咽乃暮服一丸却十日到申日復如前法訖祝曰天道無期我已得之人道雖短我與之反已受天命必得長生上呼玉女足躡魁罡應氣十二身佩三光與乾相保出觀萬方急急如律令祝畢當有玉女來迎之雲轝羽翼接兆昇天也太清金液神氣經卷中
